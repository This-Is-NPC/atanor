name: CI

# The merge gate. It runs what `mise run check` runs, plus the cluster, SeaweedFS and Rust suites, and
# every test runs once, inside coverage: the suites are split into parts that run in parallel, each part
# uploads its coverage, and the `coverage` job merges them and checks the threshold
# (docs/how-to-build-and-test.md). Every step calls a mise task or a script, so a run on a laptop and a
# run here are the same code. Branch protection needs one check, `ci`, which waits for the other jobs.

# Release pull requests are opened by release-please with the workflow token, which starts no
# pull_request run. release.yml dispatches this workflow on the release branch instead
# (workflow_dispatch below), and the `ci` check lands on the branch head commit.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the older run; runs on master are never cancelled. A dispatch
# run is keyed by its branch, so it only replaces an older dispatch on the same branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # Test modules run at once (ExUnit max_cases). Repository variable ATANOR_TEST_MAX_CASES;
  # empty means ExUnit's default, twice the cores of the runner.
  ATANOR_TEST_MAX_CASES: ${{ vars.ATANOR_TEST_MAX_CASES }}
  # Minimum line coverage per language, in percent. Repository variable ATANOR_COVERAGE_THRESHOLD; default 90.
  ATANOR_COVERAGE_THRESHOLD: ${{ vars.ATANOR_COVERAGE_THRESHOLD || '90' }}

# Each job timeout (minutes) is a repository variable named in its comment, with the default after ||.
jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    # Variable ATANOR_CI_TIMEOUT_STATIC, default 20.
    timeout-minutes: ${{ fromJSON(vars.ATANOR_CI_TIMEOUT_STATIC || '20') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-name: static
      - name: Compile with warnings as errors (test and dev)
        run: mise run check:compile
      - name: Formatting
        run: mise run check:format
      - name: Docs links
        run: mise run check:links
      - name: Workflows
        run: mise run check:workflows

  # Lists the coverage parts: native, seaweedfs, and the unit and cluster suites split into ExUnit partitions.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script needs no tools, so this job skips the mise setup (the task ci:coverage-matrix runs the same script).
      - name: List the parts
        id: matrix
        env:
          # Variables ATANOR_CI_UNIT_PARTS (default 3) and ATANOR_CI_CLUSTER_PARTS (default 6).
          UNIT_PARTS: ${{ vars.ATANOR_CI_UNIT_PARTS || '3' }}
          CLUSTER_PARTS: ${{ vars.ATANOR_CI_CLUSTER_PARTS || '6' }}
        run: echo "matrix=$(scripts/ci-coverage-matrix "$UNIT_PARTS" "$CLUSTER_PARTS")" >> "$GITHUB_OUTPUT"

  # One part of the suite, with coverage on. A part fails only when a test fails (the log has the test
  # name and the seed); the threshold is checked by the coverage job.
  part:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    # Variable ATANOR_CI_TIMEOUT_PART, default 30.
    timeout-minutes: ${{ fromJSON(vars.ATANOR_CI_TIMEOUT_PART || '30') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One cache name for every part: they all build the same instrumented tree.
      - uses: ./.github/actions/setup
        with:
          cache-name: coverage
      # The runner has Docker; the seaweedfs stage starts its disposable container and removes it when it ends.
      - name: Tests with coverage (${{ matrix.name }})
        env:
          STAGE: ${{ matrix.stage }}
          PARTITION: ${{ matrix.partition }}
        run: mise run test:coverage --no-report ${PARTITION:+--partition "$PARTITION"} "$STAGE"
      - name: Upload the coverage of the part
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.name }}
          path: cover
          if-no-files-found: error
          retention-days: 1

  # Merges the coverage of every part and checks the threshold per language. It runs no test.
  coverage:
    name: coverage
    needs: part
    runs-on: ubuntu-latest
    # Variable ATANOR_CI_TIMEOUT_COVERAGE, default 15.
    timeout-minutes: ${{ fromJSON(vars.ATANOR_CI_TIMEOUT_COVERAGE || '15') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-name: coverage
      - name: Download the coverage of the parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: cover
          merge-multiple: true
      - name: Line coverage of lib/ and the Rust crate
        run: mise run test:coverage --report-only

  # The required check: it fails unless every job above passed (a skipped or cancelled one fails it).
  ci:
    name: ci
    needs: [static, plan, part, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a job did not succeed" >&2; exit 1; }
          done
