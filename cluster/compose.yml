# An Atanor cluster in containers: N nodes, SeaweedFS as the store, HAProxy in front.
# Use it through `mise run cluster:up` (docs/how-to-run-a-cluster-in-containers.md): the scripts
# generate the secrets in cluster/secrets and build the `harness` target of the Dockerfile at the
# repository root (the product image plus the tools of this directory). The nodes are the services node-1 to node-10 (cluster:up starts the first
# ATANOR_CLUSTER_NODES): each has a fixed hostname and a network alias node-N.cluster, which is the
# advertised host of the node and so the name of the Erlang node (atanor@node-N.cluster): long names
# need a dot.
# Every setting below has a default; the variables are in the how-to.
name: atanor-cluster

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  store:
    image: ${ATANOR_CLUSTER_STORE_IMAGE:-chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/s3_access_key)" AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_key)";
        exec /entrypoint.sh mini -dir=/data -ip=store -ip.bind=0.0.0.0 -s3.port=8333 -metricsPort=9327 -admin.ui=false
    secrets: [s3_access_key, s3_secret_key]
    volumes: [store-data:/data]
    cpus: ${ATANOR_CLUSTER_STORE_CPUS:-1.5}
    mem_limit: ${ATANOR_CLUSTER_STORE_MEMORY:-2g}
    memswap_limit: ${ATANOR_CLUSTER_STORE_MEMORY:-2g}
    pids_limit: 1024
    healthcheck:
      # Any HTTP answer (even 403) means the S3 gateway is listening.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 2s
      retries: 60
    logging: *logging

  bucket:
    image: ${ATANOR_CLUSTER_IMAGE:-atanor-cluster-node:local}
    entrypoint:
      - /bin/sh
      - -c
      # A rerun finds the bucket: the store answers 409, which counts as created.
      - |
        code=$$(curl -sS -o /dev/null -w '%{http_code}' \
          --aws-sigv4 aws:amz:us-east-1:s3 --user "$$(cat /run/secrets/s3_access_key):$$(cat /run/secrets/s3_secret_key)" \
          -X PUT http://store:8333/${ATANOR_CLUSTER_BUCKET:-atanor}) || exit
        echo "bucket ${ATANOR_CLUSTER_BUCKET:-atanor}: HTTP $$code"
        case $$code in 2??|409) ;; *) exit 1 ;; esac
    secrets: [s3_access_key, s3_secret_key]
    depends_on:
      store: {condition: service_healthy}
    restart: "no"
    logging: *logging

  node-1: &node
    image: ${ATANOR_CLUSTER_IMAGE:-atanor-cluster-node:local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: harness
      args:
        RELEASE_ID: ${ATANOR_CLUSTER_RELEASE:-local}
        CARGO_BUILD_JOBS: ${ATANOR_CLUSTER_BUILD_JOBS:-6}
    init: true
    # The node is atanor@<hostname>.cluster: the hostname set by Compose (node-N) with the network
    # alias below, which a restart keeps even when the address changes. Long names need a dot.
    entrypoint:
      - /bin/sh
      - -c
      - export ATANOR_ADVERTISE="$$(hostname).cluster"; exec /opt/atanor/bin/atanor start
    hostname: node-1
    container_name: atanor-cluster-node-1
    networks:
      default: {aliases: [node, node-1.cluster]}
    cpus: ${ATANOR_CLUSTER_NODE_CPUS:-1.5}
    mem_limit: ${ATANOR_CLUSTER_NODE_MEMORY:-2g}
    memswap_limit: ${ATANOR_CLUSTER_NODE_MEMORY:-2g}
    pids_limit: 2048
    # NET_ADMIN lets `cluster:chaos partition` drop packets inside the node's own network
    # namespace; nothing on the host is touched.
    cap_add: [NET_ADMIN]
    # The chaos task restarts what it stopped; a killed node stays down until then.
    restart: "no"
    # Longer than the drain (stop.shutdown_ms, 75 s), or `docker stop` kills a node that is still handing cells back.
    stop_grace_period: ${ATANOR_CLUSTER_STOP_GRACE:-90s}
    secrets: [cookie, admin_token, dashboard_token, s3_access_key, s3_secret_key]
    # The node's settings (docs/configuration.md). The secrets are read from the mounted files.
    environment:
      ATANOR_STORE: s3://${ATANOR_CLUSTER_BUCKET:-atanor}
      ATANOR_S3_ENDPOINT: http://store:8333
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      ATANOR_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      ATANOR_DASHBOARD_TOKEN_FILE: /run/secrets/dashboard_token
      ATANOR_COOKIE_FILE: /run/secrets/cookie
      # The nodes find each other through the store. A node of another group (ATANOR_CLUSTER_GROUP) does not
      # join the others: cluster:swap-run starts the replacement so.
      ATANOR_GROUP: ${ATANOR_CLUSTER_GROUP:-}
      ATANOR_REGISTRY_TTL_MS: ${ATANOR_CLUSTER_REGISTRY_TTL_MS:-}
      ATANOR_REGISTRY_RENEW_MS: ${ATANOR_CLUSTER_REGISTRY_RENEW_MS:-}
      ATANOR_SHUTDOWN_MS: ${ATANOR_CLUSTER_SHUTDOWN_MS:-}
      ATANOR_DRAIN_TIMEOUT_MS: ${ATANOR_CLUSTER_DRAIN_TIMEOUT_MS:-}
      ATANOR_DRAIN_CONCURRENCY: ${ATANOR_CLUSTER_DRAIN_CONCURRENCY:-}
      ATANOR_LEASE_TTL_MS: ${ATANOR_CLUSTER_LEASE_TTL_MS:-30000}
      ATANOR_NET_TICKTIME: ${ATANOR_CLUSTER_NET_TICKTIME:-60}
    volumes: [/var/lib/atanor]
    depends_on:
      bucket: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -H \"authorization: Bearer $$(cat /run/secrets/admin_token)\" http://127.0.0.1:4001/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 90
    logging: *logging

  node-2:
    <<: *node
    hostname: node-2
    container_name: atanor-cluster-node-2
    networks:
      default: {aliases: [node, node-2.cluster]}
    # The image is built by node-1.
    build: !reset null
  node-3:
    <<: *node
    hostname: node-3
    container_name: atanor-cluster-node-3
    networks:
      default: {aliases: [node, node-3.cluster]}
    # The image is built by node-1.
    build: !reset null
  node-4:
    <<: *node
    hostname: node-4
    container_name: atanor-cluster-node-4
    networks:
      default: {aliases: [node, node-4.cluster]}
    # The image is built by node-1.
    build: !reset null
  node-5:
    <<: *node
    hostname: node-5
    container_name: atanor-cluster-node-5
    networks:
      default: {aliases: [node, node-5.cluster]}
    # The image is built by node-1.
    build: !reset null
  node-6:
    <<: *node
    hostname: node-6
    container_name: atanor-cluster-node-6
    networks:
      default: {aliases: [node, node-6.cluster]}
    # The image is built by node-1.
    build: !reset null
  node-7:
    <<: *node
    hostname: node-7
    container_name: atanor-cluster-node-7
    networks:
      default: {aliases: [node, node-7.cluster]}
    # The image is built by node-1.
    build: !reset null
  node-8:
    <<: *node
    hostname: node-8
    container_name: atanor-cluster-node-8
    networks:
      default: {aliases: [node, node-8.cluster]}
    # The image is built by node-1.
    build: !reset null
  node-9:
    <<: *node
    hostname: node-9
    container_name: atanor-cluster-node-9
    networks:
      default: {aliases: [node, node-9.cluster]}
    # The image is built by node-1.
    build: !reset null
  node-10:
    <<: *node
    hostname: node-10
    container_name: atanor-cluster-node-10
    networks:
      default: {aliases: [node, node-10.cluster]}
    # The image is built by node-1.
    build: !reset null

  lb:
    image: ${ATANOR_CLUSTER_LB_IMAGE:-haproxy:3.2-alpine@sha256:5893840576071e6217cd52ebdcc14f454c6f7a631056fa6f4e0f40d3cac4215b}
    entrypoint:
      - /bin/sh
      - -c
      - export ATANOR_ADMIN_TOKEN="$$(cat /run/secrets/admin_token)"; exec haproxy -db -f /usr/local/etc/haproxy/haproxy.cfg
    secrets: [admin_token]
    volumes: [./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro]
    # Everything is published on the host's loopback only.
    ports:
      - ${ATANOR_CLUSTER_BIND:-127.0.0.1}:${ATANOR_CLUSTER_HTTP_PORT:-18080}:4000
      - ${ATANOR_CLUSTER_BIND:-127.0.0.1}:${ATANOR_CLUSTER_ADMIN_PORT:-18081}:4001
      - ${ATANOR_CLUSTER_BIND:-127.0.0.1}:${ATANOR_CLUSTER_DASHBOARD_PORT:-18082}:4002
      - ${ATANOR_CLUSTER_BIND:-127.0.0.1}:${ATANOR_CLUSTER_STATS_PORT:-18083}:8404
    cpus: ${ATANOR_CLUSTER_LB_CPUS:-0.5}
    mem_limit: ${ATANOR_CLUSTER_LB_MEMORY:-256m}
    memswap_limit: ${ATANOR_CLUSTER_LB_MEMORY:-256m}
    pids_limit: 256
    restart: "no"
    logging: *logging

volumes:
  store-data:

secrets:
  cookie: {file: ./secrets/cookie}
  admin_token: {file: ./secrets/admin_token}
  dashboard_token: {file: ./secrets/dashboard_token}
  s3_access_key: {file: ./secrets/s3_access_key}
  s3_secret_key: {file: ./secrets/s3_secret_key}
