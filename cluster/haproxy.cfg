# HAProxy in front of the Atanor nodes. The servers are the replicas of the Compose service
# `node`, found through Docker's DNS; a node is in rotation only while its serving endpoint (ready and a quorum)
# answers 200 on the admin port. ATANOR_ADMIN_TOKEN comes from the entrypoint in compose.yml.
global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode http
    log global
    option dontlognull
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h
    timeout check 2s

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 1s
    hold obsolete 1s
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s

frontend http
    bind :4000
    # One line per request (id, server, timers, termination state): the swap run joins the requests that got no answer to a node.
    option httplog
    default_backend atanor_http

frontend admin
    bind :4001
    default_backend atanor_admin

frontend dashboard
    bind :4002
    default_backend atanor_dashboard

frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s

backend atanor_http
    balance roundrobin
    option redispatch
    retries 2
    # Only a failed connection is retried: a request that was sent is never repeated.
    retry-on conn-failure
    option httpchk
    http-check send meth GET uri /health/serving hdr authorization "Bearer ${ATANOR_ADMIN_TOKEN}"
    http-check expect status 200
    # Which node answered, for the load generator's log.
    http-response set-header x-atanor-server %s
    default-server check port 4001 inter 1s fall 2 rise 2 resolvers docker init-addr none
    server-template node 1-10 node:4000

backend atanor_admin
    balance roundrobin
    option redispatch
    retries 2
    retry-on conn-failure
    option httpchk
    http-check send meth GET uri /health/serving hdr authorization "Bearer ${ATANOR_ADMIN_TOKEN}"
    http-check expect status 200
    default-server check port 4001 inter 1s fall 2 rise 2 resolvers docker init-addr none
    server-template node 1-10 node:4001

backend atanor_dashboard
    # The dashboard keeps a signed cookie and a LiveView socket: stay on one node.
    balance source
    option httpchk
    http-check send meth GET uri /health/serving hdr authorization "Bearer ${ATANOR_ADMIN_TOKEN}"
    http-check expect status 200
    default-server check port 4001 inter 1s fall 2 rise 2 resolvers docker init-addr none
    server-template node 1-10 node:4002
