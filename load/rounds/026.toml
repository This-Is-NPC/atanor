# Official round 026: round 018f on Atanor 0.8.0 and Alambique 0.14.0, with the node compaction and store pool of round 025b, and the http-wasm-jobs steps of scenario B on a store reset before each step. Every key not set here keeps the default of example.toml.

[round]
scenarios = ["A", "B"]
measures = ["http-native", "http-wasm", "ws", "cells", "http-wasm-jobs", "scale", "swap"]

[output]
name = "026"

[store]
backing = "disk"

[node]
http_max_connections = 40000   # above the highest ws step (30000)

[node.compaction]       # as 025b
hold_bytes = 67108864   # 64 MiB (default 32 MiB)
concurrency = 4         # default 2
urgent_concurrency = 8  # default 4

[node.store]
pool_size = 512         # default 256

[judging.host_memory]
min_available_gib = 1.0

# Fixed ladders; http-wasm keeps the default ramp.
[measures.http-native.steps]
kind = "ladder"
[measures.http-native.per_scenario.A]
values = [490, 650, 810, 975]
[measures.http-native.per_scenario.B]
values = [1125, 1500, 1875, 2250]

[measures.ws.steps]
kind = "ladder"
[measures.ws.per_scenario.A]
values = [2400, 3200, 4000, 4800]
[measures.ws.per_scenario.B]
values = [15000, 20000, 25000, 30000]

[measures.cells.steps]
kind = "ladder"
[measures.cells.per_scenario.A]
values = [353, 470, 588, 705]
[measures.cells.per_scenario.B]
values = [1500, 2000, 2500, 3000]

[measures.http-wasm-jobs.steps]
kind = "ladder"
[measures.http-wasm-jobs.per_scenario.A]
values = [34, 45, 56, 68]
[measures.http-wasm-jobs.per_scenario.B]
values = [68, 90, 112, 135]
reset_each_step = true  # the store (memory limit 2g) filled up over the steps of 018f: each step starts on an empty store

# The scale measure runs on scenario A only: 1 and 2 nodes, then the join.
[measures.scale]
run_on = ["A"]

[scale]
max_nodes = 2
ceiling_factors = [1.0, 1.5]

[scale.ceilings]
"http-native:1" = 600
"http-native:2" = 840
"cells:1" = 470
"cells:2" = 750
