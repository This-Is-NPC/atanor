# Round 026r: the measures of round 026 that came out below round 018f, run again with the same settings (Atanor 0.8.0, Alambique 0.14.0,
# node config of round 025b). Their A/B against the default node config showed no effect of the config: the store stalls came in both arms.
# Every key not set here keeps the default of example.toml.

[round]
cases = ["A/http-native", "A/http-wasm", "A/cells", "A/http-wasm-jobs", "A/swap", "B/http-native", "B/http-wasm", "B/cells"]

[output]
name = "026r"

[store]
backing = "disk"

[node]
http_max_connections = 40000   # as 026

[node.compaction]       # as 025b
hold_bytes = 67108864   # 64 MiB (default 32 MiB)
concurrency = 4         # default 2
urgent_concurrency = 8  # default 4

[node.store]
pool_size = 512         # default 256

[judging.host_memory]
min_available_gib = 1.0

# The ladders of 026; http-wasm keeps the default ramp.
[measures.http-native.steps]
kind = "ladder"
[measures.http-native.per_scenario.A]
values = [490, 650, 810, 975]
[measures.http-native.per_scenario.B]
values = [1125, 1500, 1875, 2250]

[measures.cells.steps]
kind = "ladder"
[measures.cells.per_scenario.A]
values = [353, 470, 588, 705]
[measures.cells.per_scenario.B]
values = [1500, 2000, 2500, 3000]

[measures.http-wasm-jobs.steps]
kind = "ladder"
[measures.http-wasm-jobs.per_scenario.A]
values = [34, 45, 56, 68]
