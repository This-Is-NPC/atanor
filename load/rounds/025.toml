# Round 025: the node join of round 018f on scenario A, alone, to read the release compaction counters of /runtime (hibernations.compaction, tail_max).
# The scale measure needs one 1-node step before the join; it is short (one step of 30 s at half the 018f ceiling). The 2-node ramp is skipped (no ceiling given).
# The join rate is the one of 018f: 1.5 times its 1-node http-native ceiling (600 req/s). Every key not set here keeps the default of example.toml.

[round]
scenarios = ["A"]
measures = ["scale"]

[output]
name = "025"

[store]
backing = "disk"

[node]
http_max_connections = 40000   # as 018f

[judging.host_memory]
min_available_gib = 1.0

[measures.http-native.steps]
duration_s = 30.0
confirm = false

[scale]
max_nodes = 2
loads = ["http-native"]
ceiling_factors = [0.5]

[scale.ceilings]
"http-native:1" = 600

[scale.join]
rate = 900.0
